services:
  bug-reporter:
    build: .
    container_name: ramshackle-bug-reporter
    restart: unless-stopped
    ports:
      - "5000:5000"
    # Load environment variables from .env file
    env_file:
      - .env
    # You can also override environment variables inline here if needed:
    # environment:
    #   - NODE_ENV=production
    #   - PORT=5000
    #   - PLATFORM=gitlab
    #   - GITLAB_TOKEN=your_token_here
    #   - GITLAB_URL=https://git.ramshacklegame.com
    #   - GITLAB_PROJECT_ID=namespace/project
    volumes:
      # Persist uploaded files
      - ./uploads:/app/uploads
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
